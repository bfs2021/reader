name: Desktop

# Builds the desktop app (desktop/) at a release's tag, on each platform for
# its own installer, and adds them to the release: a .dmg for macOS on Apple
# silicon and on Intel, an .exe for Windows, an AppImage for Linux. Called
# by the release workflow once it has tagged; or run by hand to build a
# release's again.
#
# Not signed yet: macOS asks for it to be opened from System Settings →
# Privacy & Security the first time, and Windows' SmartScreen for More info
# → Run anyway.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released version to build, as tagged without its v (e.g. 0.0.1)
        required: true

permissions:
  contents: read

concurrency:
  group: desktop
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' isn't a version like 0.0.1"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci --omit=dev
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: desktop

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          gh release upload "v$VERSION" --clobber desktop/dist/*.{dmg,exe,AppImage}
