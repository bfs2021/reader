name: reader export
description: Save markdown documents as HTML with reader, and commit what changed.
branding:
  icon: file-text
  color: gray-dark

inputs:
  files:
    description: The documents to export, separated by spaces or newlines, relative to the repository. Each is saved beside itself as <name>.html.
    required: true
  commit:
    description: Commit and push the HTML that changed. 'false' leaves it in the working tree for a later step.
    default: 'true'
  message:
    description: The commit message.
    default: Export HTML with reader

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Install reader
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund

    - name: Export
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        # The input is split on spaces and new lines with nothing matched yet,
        # then each pattern is matched on its own, so a name it matches is
        # never split again or taken as a pattern.
        set -f
        read -r -d '' -a patterns <<<"$FILES" || true
        set +f
        files=()
        IFS=
        for pattern in "${patterns[@]}"; do
          matches=( $pattern )
          files+=( "${matches[@]}" )
        done
        unset IFS
        node "$GITHUB_ACTION_PATH/bin/reader.js" export -- "${files[@]}"
        # What was saved, a NUL after each, as a name can hold a new line.
        for file in "${files[@]}"; do
          printf '%s\0' "${file%.*}.html"
        done > "$RUNNER_TEMP/reader-exported"

    - name: Commit
      if: inputs.commit == 'true'
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        # Each name is added as itself, never as a pattern matching others.
        git --literal-pathspecs add --pathspec-from-file="$RUNNER_TEMP/reader-exported" --pathspec-file-nul
        if git diff --cached --quiet; then
          echo "The HTML is up to date."
          exit 0
        fi
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$MESSAGE"
        git push
